spring.application.name=day-01-reactive-catalog
server.port=8080

# Muestra en el log las peticiones que procesa el DispatcherHandler (útil en clase)
logging.level.org.springframework.web.reactive.DispatcherHandler=DEBUG
logging.level.com.curso.webflux=DEBUG

# Actuator: /actuator/mappings muestra los HandlerMapping que consulta el DispatcherHandler
management.endpoints.web.exposure.include=health,info,mappings,beans
