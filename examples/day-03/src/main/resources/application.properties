spring.application.name=day-03-reactive-catalog
server.port=8080

logging.level.com.curso.webflux=DEBUG

# Jackson: rechazar propiedades desconocidas en el JSON de entrada ({"quantiy": 2} -> 400)
# Jackson 3 lo tiene desactivado por defecto; en una API pública conviene ser estricto.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Codecs HTTP: tamaño máximo que se acumula en memoria al decodificar un cuerpo (por defecto 256KB)
spring.http.codecs.max-in-memory-size=512KB

# Multipart: por encima de este tamaño cada parte se vuelca a un fichero temporal
spring.webflux.multipart.max-in-memory-size=64KB

# Actuator: /actuator/mappings muestra las rutas anotadas Y funcionales
management.endpoints.web.exposure.include=health,info,mappings

# ---------------------------------------------------------------------------------------------
# Día 3 — WebClient: URLs de los "otros microservicios" (en el curso, esta misma aplicación)
# ---------------------------------------------------------------------------------------------
# Catálogo: WebClient construido a mano en client/ClientConfig (propiedad propia de la aplicación)
app.services.catalog.base-url=http://localhost:${server.port}
# Pedidos: HTTP Service Client (@ImportHttpServices, grupo "orders"), propiedades de Spring Boot 4
spring.http.serviceclient.orders.base-url=http://localhost:${server.port}
spring.http.serviceclient.orders.read-timeout=2s

# Timeouts por defecto de TODOS los clientes HTTP creados por Spring Boot (red de seguridad)
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s

# ---------------------------------------------------------------------------------------------
# Día 3 — Caché HTTP de recursos estáticos (index.html, cors.html...)
# ---------------------------------------------------------------------------------------------
# Cache-Control: max-age=600, public. Last-Modified se envía por defecto (use-last-modified=true).
spring.web.resources.cache.cachecontrol.max-age=10m
spring.web.resources.cache.cachecontrol.cache-public=true

# ---------------------------------------------------------------------------------------------
# Día 3 — HTTP/2. Sin TLS, Reactor Netty acepta h2c (HTTP/2 en claro) además de HTTP/1.1.
# Con TLS (perfil "tls", application-tls.properties) se negocia h2 mediante ALPN.
# ---------------------------------------------------------------------------------------------
server.http2.enabled=true
