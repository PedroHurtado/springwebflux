<!DOCTYPE html>
<!--
  Fragmentos reutilizables: th:fragment los define y th:replace="~{fragments :: nombre}" los inserta.
  Es la forma sencilla de compartir cabecera y menú entre páginas sin un "layout dialect".
-->
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · Catálogo reactivo'">Catálogo reactivo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; }
    table { border-collapse: collapse; width: 100%; }
    td, th { border-bottom: 1px solid #ddd; padding: .4rem; text-align: left; }
    td.num, th.num { text-align: right; }
    .low { color: #b3261e; font-weight: 600; }
    .error { color: #b3261e; font-size: .9rem; }
    .hint { color: #555; font-size: .9rem; }
    form p { margin: .6rem 0; }
    label { display: inline-block; min-width: 7rem; }
    code { background: #f2f2f2; padding: 0 .3rem; }
  </style>
</head>
<body>
<nav th:fragment="nav">
  <a href="/">Inicio</a>
  <a th:href="@{/catalog}">Catálogo</a>
  <a th:href="@{/catalog/live}">Catálogo (data-driven)</a>
  <a th:href="@{/catalog/new}">Nuevo producto</a>
  <a href="/ws.html">WebSockets</a>
</nav>
</body>
</html>
